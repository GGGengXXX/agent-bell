[project]
name = "agent-bell"
version = "0.2.0"
description = "A local completion notifier for Codex, agents, and terminal commands"
readme = "docs/infra.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
agent-bell = "agent_bell:main"
abll = "agent_bell:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true
